<svg xmlns="http://www.w3.org/2000/svg" width="900" height="16" viewBox="0 0 900 16" role="presentation">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="0" y="7" width="900" height="2" rx="1" fill="url(#l)"/>
  <circle cx="450" cy="8" r="5" fill="#1F6FEB" filter="url(#g)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <rect x="445" y="3" width="10" height="10" rx="2" transform="rotate(45 450 8)" fill="#A5D6FF"/>
</svg>
